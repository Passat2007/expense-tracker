<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-light">

  <!-- Navbar -->
  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container d-flex justify-content-between align-items-center">
      <span class="navbar-brand mb-0 h1">Expense Tracker</span>
      <button id="dark-mode-toggle" class="btn btn-outline-light btn-sm" type="button">
        🌙 Dark Mode
      </button>
    </div>
  </nav>

  <div class="container pb-5">
    <div id="alert-container"></div>

    <div class="summary-grid mb-4">
      <div class="card shadow-sm border-0 h-100">
        <div class="card-body">
          <h6 class="text-muted text-uppercase mb-2">Total Amount</h6>
          <h3 class="fw-bold text-primary mb-0" id="total-amount">$0.00</h3>
        </div>
      </div>
      <div class="card shadow-sm border-0 h-100">
        <div class="card-body">
          <h6 class="text-muted text-uppercase mb-2">Number of Expenses</h6>
          <h3 class="fw-bold text-dark mb-0" id="total-count">0</h3>
        </div>
      </div>
      <div class="card shadow-sm border-0 h-100">
        <div class="card-body">
          <h6 class="text-muted text-uppercase mb-2">Highest Expense</h6>
          <h3 class="fw-bold text-danger mb-0" id="highest-expense">$0.00</h3>
        </div>
      </div>
    </div>

    <div class="card shadow-sm border-0 mb-4">
      <div class="card-body">
        <h5 class="card-title mb-3">Add New Expense</h5>
        <form id="expense-form" novalidate>
          <div class="row g-3">
            <div class="col-md-4">
              <label for="title" class="form-label">Title</label>
              <input type="text" id="title" class="form-control" placeholder="e.g. Lunch" required />
            </div>
            <div class="col-md-2">
              <label for="amount" class="form-label">Amount ($)</label>
              <input type="number" id="amount" class="form-control" step="0.01" min="0.01" placeholder="0.00" required />
            </div>
            <div class="col-md-3">
              <label for="category" class="form-label">Category</label>
              <select id="category" class="form-select" required>
                <option value="">Select category...</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Bills">Bills</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <div class="col-md-3">
              <label for="date" class="form-label">Date</label>
              <input type="date" id="date" class="form-control" required />
            </div>
          </div>
          <div class="mt-3 text-end">
            <button type="submit" class="btn btn-primary px-4">Add Expense</button>
          </div>
        </form>
      </div>
    </div>

    <div class="card shadow-sm border-0">
      <div class="card-body">
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
          <h5 class="card-title mb-0">Expenses List</h5>
          <div class="d-flex align-items-center gap-2">
            <label for="filter-category" class="form-label mb-0 text-nowrap">Filter by Category:</label>
            <select id="filter-category" class="form-select form-select-sm" style="width: 160px;">
              <option value="All">All</option>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Bills">Bills</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>

        <div id="loading-spinner" class="text-center my-4 d-none">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
        </div>

        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th>Title</th>
                <th>Amount</th>
                <th>Category</th>
                <th>Date</th>
                <th class="text-end">Actions</th>
              </tr>
            </thead>
            <tbody id="expenses-tbody">
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="edit-form" novalidate>
          <div class="modal-header">
            <h5 class="modal-title">Edit Expense</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="edit-id" />
            <div class="mb-3">
              <label for="edit-title" class="form-label">Title</label>
              <input type="text" id="edit-title" class="form-control" required />
            </div>
            <div class="mb-3">
              <label for="edit-amount" class="form-label">Amount ($)</label>
              <input type="number" id="edit-amount" class="form-control" step="0.01" min="0.01" required />
            </div>
            <div class="mb-3">
              <label for="edit-category" class="form-label">Category</label>
              <select id="edit-category" class="form-select" required>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Bills">Bills</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <div class="mb-3">
              <label for="edit-date" class="form-label">Date</label>
              <input type="date" id="edit-date" class="form-control" required />
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Save Changes</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
